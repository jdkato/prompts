name: Build + Test

on: [push, pull_request]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The archive is what users install, so the license travels inside it.
      - run: cp LICENSE Prompts/
      - run: zip -r Prompts.zip Prompts -x "*.DS_Store"

      - name: Upload style to release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: Prompts.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SectionLength scopes a metric to a `doc(...)` selection, which is on
      # Vale's v3 branch -- built from source until the release that ships it.
      - uses: actions/checkout@v4
        with:
          repository: vale-cli/vale
          ref: v3
          path: vale-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: vale-src/go.mod
      - run: |
          go build -o "$RUNNER_TEMP/bin/vale" ./cmd/vale
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
        working-directory: vale-src

      - run: ./test.sh
